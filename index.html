<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>泥嚎小宝 ♡</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #fff8f3;

      font-family:
        "Songti SC",
        "STSong",
        serif;

      color: #4b3a35;
      text-align: center;
    }

    .letter {
      width: 85%;
      max-width: 420px;

      background: #fffdf9;

      padding: 55px 30px;

      border-radius: 18px;

      box-shadow:
        0 10px 35px rgba(80, 50, 40, 0.12);
    }

    .heart {
      font-size: 25px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;

      letter-spacing: 6px;

      margin-bottom: 35px;
    }

    .to {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .message {
      font-size: 16px;
      line-height: 2;

      margin-bottom: 40px;
    }

    button {
      border: none;

      background: #e8b7b1;
      color: white;

      padding: 14px 30px;

      border-radius: 30px;

      font-size: 16px;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

  </style>
</head>


<body>

  <div class="letter">

    <div class="heart">♡</div>

    <h1>你今天过得好吗？睡得好吗？想我了吗？</h1>

    <div class="to">
      To：我的小宝
    </div>

    <div class="message">

      我拖了很久才写这封信，<br>
      
      因为有太多复杂的情绪，<br>
      
      不知道怎么说出来，<br>
      
      写信可以把我很多腼腆而说不出口的思想表达出来，<br>
      
      好啦！接下来才是我真正想告诉你的话。

    </div>

    <button>
      💌
    </button>

  </div>

</body>

</html>
