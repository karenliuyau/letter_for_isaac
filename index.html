<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>泥嚎小宝 ♡</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #fff8f3;

      font-family:
        "Songti SC",
        "STSong",
        serif;

      color: #4b3a35;
      text-align: center;
    }

    .letter {
      width: 85%;
      max-width: 420px;

      background: #fffdf9;

      padding: 55px 30px;

      border-radius: 18px;

      box-shadow:
        0 10px 35px rgba(80, 50, 40, 0.12);
    }

    .heart {
      font-size: 25px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;

      letter-spacing: 6px;

      margin-bottom: 35px;
    }

    .to {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .message {
      font-size: 16px;
      line-height: 2;

      margin-bottom: 40px;
    }

    button {
      border: none;

      background: #e8b7b1;
      color: white;

      padding: 14px 30px;

      border-radius: 30px;

      font-size: 16px;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #voice-letter {
  display: none;
  animation: fadeIn 1.2s ease;
}

#voice-letter h2 {
  font-size: 24px;
  font-weight: normal;
  letter-spacing: 4px;
  margin-top: 20px;
  margin-bottom: 30px;
}

#voice-letter p {
  font-size: 16px;
  line-height: 2;
}

.small-heart {
  font-size: 22px;
  margin-top: 10px;
}

.headphones {
  font-size: 30px;
  margin-top: 25px;
}

.little-note {
  font-size: 13px !important;
  opacity: 0.6;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
    
  </style>
</head>


<body>

  <div class="letter">

    <div class="heart">♡</div>

    <h1>宝宝今天过得好吗？睡得好吗？想我了吗？</h1>

    <div class="to">
      To：我的小宝
    </div>

    <div class="message">

      我拖了很久才写这封信，<br>
      
      因为有太多复杂的情绪，<br>
      
      不知道怎么说出来，<br>
      
      写信可以把我很多腼腆而说不出口的思想表达出来，<br>
      
      好啦！接下来才是我真正想告诉你的话。

    </div>

    <button id="open-button" onclick="openLetter()">
  💌 点开听声音
</button>

<div id="voice-letter">

  <div class="small-heart">♡</div>

  <h2>给小宝</h2>

  </p>

</div>
  
<script>

function openLetter() {

  document.querySelector(".message").style.display = "none";

  document.getElementById("open-button").style.display = "none";

  document.getElementById("voice-letter").style.display = "block";

}

</script>
  
</body>

</html>
